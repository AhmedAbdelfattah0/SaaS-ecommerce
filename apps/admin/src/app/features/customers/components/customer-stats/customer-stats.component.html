<div class="kpi-grid">
  <!-- Total Orders -->
  <div class="kpi">
    <div class="kpi-head">
      <div class="kpi-label">Total Orders</div>
      <div class="kpi-icon" style="background: var(--color-primary-light); color: var(--color-primary);">
        <admin-icon name="cart" [size]="18" />
      </div>
    </div>
    <div class="kpi-value" style="color: var(--color-primary);">{{ ordersCount() }}</div>
    <div style="font-size: 12px; color: var(--color-text-muted);">Lifetime orders placed</div>
  </div>

  <!-- Total Spent -->
  <div class="kpi">
    <div class="kpi-head">
      <div class="kpi-label">Total Spent</div>
      <div class="kpi-icon" style="background: var(--color-success-light); color: var(--color-success);">
        <admin-icon name="dollar" [size]="18" />
      </div>
    </div>
    <div class="kpi-value" style="color: var(--color-success); font-size: 20px;">{{ totalSpentFormatted() }}</div>
    <div style="font-size: 12px; color: var(--color-text-muted);">Lifetime revenue</div>
  </div>

  <!-- Avg Order Value -->
  <div class="kpi">
    <div class="kpi-head">
      <div class="kpi-label">Avg. Order Value</div>
      <div class="kpi-icon" style="background: var(--color-warning-light); color: var(--color-warning);">
        <admin-icon name="trendingup" [size]="18" />
      </div>
    </div>
    <div class="kpi-value" style="color: var(--color-warning); font-size: 20px;">{{ avgOrderValueFormatted() }}</div>
    <div style="font-size: 12px; color: var(--color-text-muted);">Per order average</div>
  </div>

  <!-- Last Order -->
  <div class="kpi">
    <div class="kpi-head">
      <div class="kpi-label">Last Order</div>
      <div class="kpi-icon" style="background: var(--color-purple-light); color: var(--color-purple);">
        <admin-icon name="calendar" [size]="18" />
      </div>
    </div>
    <div class="kpi-value" style="color: var(--color-purple); font-size: 18px;">{{ formatLastOrder(lastOrderDate()) }}</div>
    <div style="font-size: 12px; color: var(--color-text-muted);">Most recent activity</div>
  </div>
</div>

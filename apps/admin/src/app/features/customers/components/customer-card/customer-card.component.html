<div class="card">
  <!-- Profile header -->
  <div class="card-pad" style="display: flex; flex-direction: column; align-items: center; gap: var(--sp-3); text-align: center; border-bottom: 1px solid var(--color-border);">
    <div
      class="avatar xl"
      [style.background]="avatarBg()"
    >{{ initials_() }}</div>
    <div>
      <div style="font-size: 17px; font-weight: 700; color: var(--color-text);">{{ customer().name }}</div>
      <div class="muted" style="font-size: 13px; margin-top: 2px;">{{ customer().email }}</div>
    </div>
    <div class="badge badge-green" style="margin-top: var(--sp-1);">
      <span class="badge-dot"></span>Active Customer
    </div>
  </div>

  <!-- Contact details -->
  <div class="card-pad stack gap-3">
    @if (customer().phone) {
      <div class="hstack gap-3" style="font-size: 13px;">
        <admin-icon name="phone" [size]="15" style="color: var(--color-text-muted); flex-shrink: 0;" />
        <span>{{ customer().phone }}</span>
      </div>
    }
    <div class="hstack gap-3" style="font-size: 13px;">
      <admin-icon name="mail" [size]="15" style="color: var(--color-text-muted); flex-shrink: 0;" />
      <span class="truncate">{{ customer().email }}</span>
    </div>
    <div class="hstack gap-3" style="font-size: 13px;">
      <admin-icon name="calendar" [size]="15" style="color: var(--color-text-muted); flex-shrink: 0;" />
      <span class="muted">Joined {{ joinedDate() }}</span>
    </div>

    @if (fullAddress()) {
      <div class="divider"></div>
      <div>
        <div style="font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--color-text-muted); margin-bottom: var(--sp-2);">Default Address</div>
        <div style="font-size: 13px; line-height: 1.6; color: var(--color-text);">{{ fullAddress() }}</div>
      </div>
    }
  </div>
</div>

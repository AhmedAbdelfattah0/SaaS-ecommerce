<div class="card">
  <!-- Profile header -->
  <div class="card-pad profile-header">
    <div
      class="avatar xl"
      [style.background]="avatarBg()"
    >{{ initials_() }}</div>
    <div>
      <div class="customer-display-name">{{ customer().name }}</div>
      <div class="muted customer-display-email">{{ customer().email }}</div>
    </div>
    <div class="badge badge-green" style="margin-block-start: var(--sp-1);">
      <span class="badge-dot"></span>Active Customer
    </div>
  </div>

  <!-- Contact details -->
  <div class="card-pad contact-list">
    @if (customer().phone) {
      <div class="contact-row">
        <admin-icon name="phone" [size]="15" class="contact-icon" />
        <span>{{ customer().phone }}</span>
      </div>
    }
    <div class="contact-row">
      <admin-icon name="mail" [size]="15" class="contact-icon" />
      <span class="truncate">{{ customer().email }}</span>
    </div>
    <div class="contact-row">
      <admin-icon name="calendar" [size]="15" class="contact-icon" />
      <span class="muted">Joined {{ joinedDate() }}</span>
    </div>

    @if (fullAddress()) {
      <div class="divider"></div>
      <div>
        <div class="address-label">Default Address</div>
        <div class="address-text">{{ fullAddress() }}</div>
      </div>
    }
  </div>
</div>

<div class="field">
  <label [for]="inputId()">{{ label() }}</label>
  <div class="colorpick">
    <input
      [id]="inputId()"
      type="color"
      [value]="value()"
      (input)="onColorInput($event)"
      [attr.aria-label]="label() + ' color picker'"
    />
    <input
      type="text"
      class="input"
      [class.is-invalid]="hexControl.touched && hexControl.invalid"
      style="flex: 1;"
      [formControl]="hexControl"
      maxlength="7"
      placeholder="#000000"
      (input)="onHexInput($event)"
      [attr.aria-label]="label() + ' hex value'"
      [attr.aria-invalid]="hexControl.touched && hexControl.invalid"
    />
    <span
      class="swatch"
      [style.background]="value()"
      [attr.aria-hidden]="true"
    ></span>
  </div>
  <sc-field-error [control]="hexControl" [messages]="hexMessages" />
</div>

<div class="field">
  <label>Store Logo</label>

  @if (displayUrl) {
    <div class="logo-preview">
      <img [src]="displayUrl" alt="Store logo preview" class="logo-preview__img" />
      <div class="logo-preview__actions">
        <button type="button" class="btn btn-sm btn-secondary" (click)="openPicker()">
          Change
        </button>
        <button type="button" class="btn btn-sm btn-danger-outline" (click)="clearPreview()">
          Remove
        </button>
      </div>
    </div>
  } @else {
    <div
      class="upload"
      [class.upload--drag]="isDragging()"
      (click)="openPicker()"
      (dragover)="onDragOver($event)"
      (dragleave)="onDragLeave()"
      (drop)="onDrop($event)"
      role="button"
      tabindex="0"
      aria-label="Upload store logo"
      (keydown.enter)="openPicker()"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin: 0 auto var(--sp-2); display: block; color: var(--color-text-subtle);">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17,8 12,3 7,8"/><line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
      <p style="margin: 0 0 var(--sp-1); font-weight: 500; color: var(--color-text);">
        Drop image here or click to browse
      </p>
      <p style="margin: 0; font-size: 12px; color: var(--color-text-subtle);">
        PNG, JPG, SVG, WebP — max 2 MB
      </p>
    </div>
  }

  <input
    #fileInput
    type="file"
    accept="image/*"
    style="display: none;"
    (change)="onFileChange($event)"
    aria-hidden="true"
  />
</div>

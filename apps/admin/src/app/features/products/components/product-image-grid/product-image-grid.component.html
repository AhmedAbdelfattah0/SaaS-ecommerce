<div class="image-grid-wrap">
  <div class="image-grid">
    @for (img of images(); track img; let i = $index) {
      <div class="image-cell">
        <img [src]="img" [alt]="'Product image ' + (i + 1)" class="image-thumb" />
        @if (!readonly()) {
          <button
            type="button"
            class="image-remove"
            (click)="onRemove(i)"
            title="Remove image"
          >
            <admin-icon name="x" [size]="12" />
          </button>
        }
      </div>
    }

    @if (!readonly()) {
      <div class="image-add-cell">
        <div class="upload">
          <admin-icon name="upload" [size]="20" />
          <p style="margin: var(--sp-2) 0 0;">Add image URL</p>
          <div class="url-row">
            <input
              #urlInput
              type="url"
              class="url-input"
              placeholder="https://example.com/image.jpg"
              (keyup.enter)="onAddUrl(urlInput)"
            />
            <button type="button" class="btn-add" (click)="onAddUrl(urlInput)">
              Add
            </button>
          </div>
        </div>
      </div>
    }
  </div>

  @if (images().length === 0 && readonly()) {
    <div style="color: var(--color-text-muted); font-size: 13px; padding: var(--sp-4);">
      No images added.
    </div>
  }
</div>

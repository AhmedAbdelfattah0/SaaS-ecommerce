<td class="no-nav" style="width: 44px; padding-left: var(--sp-4);">
  <div
    class="checkbox"
    [class.on]="isSelected()"
    (click)="onToggleSelect($event)"
    role="checkbox"
    [attr.aria-checked]="isSelected()"
  >
    @if (isSelected()) {
      <svg viewBox="0 0 11 11" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="1,5.5 4,8.5 10,2.5" />
      </svg>
    }
  </div>
</td>

<td style="width: 56px;">
  <div class="product-img">
    @if (hasImage()) {
      <img [src]="product().images[0]" [alt]="product().name" style="width: 100%; height: 100%; object-fit: cover;" />
    } @else {
      <div class="product-img-placeholder" style="width: 100%; height: 100%; background: var(--color-primary-light); display: grid; place-items: center; color: var(--color-primary); font-size: 10px; font-weight: 700;">
        {{ product().name.charAt(0).toUpperCase() }}
      </div>
    }
  </div>
</td>

<td>
  <div style="font-weight: 500; color: var(--color-text);">{{ product().name }}</div>
  <div class="muted mono" style="margin-top: 2px;">{{ product().slug }}</div>
</td>

<td class="muted">{{ categoryName() || '—' }}</td>

<td class="num">{{ formattedPrice() }}</td>

<td>
  <span [class]="'stock-badge ' + stockClass()">{{ product().stock }}</span>
</td>

<td>
  <admin-product-status-badge [status]="product().status" />
</td>

<td>
  <div class="row-actions no-nav">
    <button class="icon-btn" title="Edit" (click)="onEdit($event)">
      <admin-icon name="edit" [size]="15" />
    </button>
    <button class="icon-btn danger" title="Delete" (click)="onDelete($event)">
      <admin-icon name="trash" [size]="15" />
    </button>
  </div>
</td>

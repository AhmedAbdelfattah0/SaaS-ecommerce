<div class="bulk-bar">
  <span style="font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.9);">
    {{ selectedCount() }} selected
  </span>

  <button type="button" class="btn" (click)="onSetStatus('active')">
    <admin-icon name="check" [size]="13" />
    Set Active
  </button>

  <button type="button" class="btn" (click)="onSetStatus('draft')">
    <admin-icon name="eyeoff" [size]="13" />
    Set Draft
  </button>

  <button type="button" class="btn btn-danger" (click)="onDelete()">
    <admin-icon name="trash" [size]="13" />
    Delete
  </button>

  <span class="spacer"></span>

  <button type="button" class="btn btn-ghost" (click)="onClear()">
    <admin-icon name="x" [size]="13" />
    Clear
  </button>
</div>

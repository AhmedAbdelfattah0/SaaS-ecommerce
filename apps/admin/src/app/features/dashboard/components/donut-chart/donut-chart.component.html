<div class="donut-wrap" style="height:160px;width:160px">
  <svg viewBox="0 0 160 160" aria-label="Orders by status donut chart" style="display:block">
    @for (arc of arcs(); track arc.label) {
      <path
        [attr.d]="arc.d"
        [attr.fill]="arc.color"
        stroke="var(--color-surface)"
        stroke-width="2"
      />
    }
  </svg>
  <div class="donut-center">
    <div class="n">{{ total() }}</div>
    <div class="l">{{ label() }}</div>
  </div>
</div>

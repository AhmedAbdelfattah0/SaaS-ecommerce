<div style="position:relative;width:100%;">
  <svg
    [attr.viewBox]="viewBox()"
    preserveAspectRatio="xMidYMid meet"
    aria-label="Revenue chart"
    style="width:100%;display:block;overflow:visible"
  >
    <defs>
      <linearGradient id="rev-grad-current" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="var(--color-primary)" stop-opacity="0.18" />
        <stop offset="100%" stop-color="var(--color-primary)" stop-opacity="0" />
      </linearGradient>
      <linearGradient id="rev-grad-previous" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="var(--color-border-strong)" stop-opacity="0.25" />
        <stop offset="100%" stop-color="var(--color-border-strong)" stop-opacity="0" />
      </linearGradient>
    </defs>

    <!-- Y-axis grid lines + labels -->
    @for (tick of yTicks(); track tick.value) {
      <line
        [attr.x1]="40"
        [attr.x2]="440"
        [attr.y1]="tick.y.toFixed(1)"
        [attr.y2]="tick.y.toFixed(1)"
        stroke="var(--color-border)"
        stroke-dasharray="4 3"
        stroke-width="1"
      />
      <text
        [attr.x]="35"
        [attr.y]="tick.y + 4"
        text-anchor="end"
        style="font-size:10px;fill:var(--color-text-muted);font-family:var(--font-sans)"
      >{{ tick.label }}</text>
    }

    <!-- Previous period area + line -->
    @if (previousPaths().areaPath) {
      <path
        [attr.d]="previousPaths().areaPath"
        fill="url(#rev-grad-previous)"
        stroke="none"
      />
    }
    @if (previousPaths().linePath) {
      <path
        [attr.d]="previousPaths().linePath"
        fill="none"
        stroke="var(--color-border-strong)"
        stroke-width="1.5"
        stroke-dasharray="5 3"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    }

    <!-- Current period area + line -->
    @if (currentPaths().areaPath) {
      <path
        [attr.d]="currentPaths().areaPath"
        fill="url(#rev-grad-current)"
        stroke="none"
      />
    }
    @if (currentPaths().linePath) {
      <path
        [attr.d]="currentPaths().linePath"
        fill="none"
        stroke="var(--color-primary)"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    }

    <!-- X-axis labels -->
    @for (lbl of xLabels(); track lbl.label) {
      <text
        [attr.x]="lbl.x"
        [attr.y]="212"
        text-anchor="middle"
        style="font-size:10px;fill:var(--color-text-muted);font-family:var(--font-sans)"
      >{{ lbl.label }}</text>
    }
  </svg>

  <!-- Legend -->
  <div style="display:flex;gap:var(--sp-4);justify-content:flex-end;margin-top:var(--sp-2)">
    <span style="display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--color-text-muted)">
      <span style="display:inline-block;width:16px;height:2px;background:var(--color-primary);border-radius:2px"></span>
      Current
    </span>
    <span style="display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--color-text-muted)">
      <span style="display:inline-block;width:16px;height:2px;background:var(--color-border-strong);border-radius:2px;border-top:1.5px dashed var(--color-border-strong)"></span>
      Previous
    </span>
  </div>
</div>

name = "storecraft-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Override locally in .dev.vars — NEVER commit secrets
# SENTRY_DSN = "https://your-dsn@sentry.io/project-id"  # TODO(Task 26): add when Sentry Workers support stabilises
# ENVIRONMENT = "production"

# Cloudflare Pages custom domains route all traffic here
# Each tenant points their domain CNAME to *.pages.dev

[[routes]]
pattern = "*/api/*"
zone_name = ""

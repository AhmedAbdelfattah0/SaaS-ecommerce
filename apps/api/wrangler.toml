name = "storecraft-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Override locally in .dev.vars — NEVER commit secrets

# Production routes — used by `wrangler deploy`, not by `wrangler dev`
# Uncomment before deploying:
# [[routes]]
# pattern = "*/api/*"
# zone_name = ""

[dev]
ip = "127.0.0.1"
port = 8787
local_protocol = "http"